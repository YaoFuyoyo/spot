<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>产业链平台</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; min-height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    color: #333;
    background: linear-gradient(135deg, #f5f3ff 0%, #ede9fe 50%, #faf5ff 100%);
    background-attachment: fixed;
  }

  /* ===== 顶部导航栏 ===== */
  #header {
    height: 56px;
    background: linear-gradient(180deg, rgba(255,255,255,0.95), rgba(245,243,255,0.9));
    border-bottom: 1px solid rgba(139,92,246,0.15);
    display: flex;
    align-items: center;
    padding: 0 32px;
    gap: 16px;
    backdrop-filter: blur(10px);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  #header .brand {
    font-size: 16px;
    font-weight: 600;
    color: #1a1a2e;
    letter-spacing: 1px;
    background: linear-gradient(90deg, #8b5cf6, #c084fc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* ===== 主体 ===== */
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 64px 32px;
  }
  .page-title {
    font-size: 28px;
    font-weight: 600;
    color: #1a1a2e;
    margin-bottom: 8px;
  }
  .page-subtitle {
    font-size: 14px;
    color: #888;
    margin-bottom: 40px;
  }

  /* ===== 工具卡片网格 ===== */
  #toolGrid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
  }
  .tool-card {
    position: relative;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(139,92,246,0.2);
    border-radius: 12px;
    padding: 28px 24px;
    cursor: pointer;
    text-decoration: none;
    color: inherit;
    display: block;
    transition: all 0.25s ease;
    overflow: hidden;
  }
  .tool-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, #8b5cf6, #c084fc);
    opacity: 0;
    transition: opacity 0.25s ease;
  }
  .tool-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 32px rgba(139,92,246,0.18);
    border-color: rgba(139,92,246,0.45);
  }
  .tool-card:hover::before { opacity: 1; }

  .tool-card .tc-icon {
    width: 48px; height: 48px;
    border-radius: 12px;
    background: linear-gradient(135deg, rgba(139,92,246,0.12), rgba(192,132,252,0.12));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    margin-bottom: 16px;
  }
  .tool-card .tc-title {
    font-size: 17px;
    font-weight: 600;
    color: #1a1a2e;
    margin-bottom: 6px;
  }
  .tool-card .tc-desc {
    font-size: 13px;
    color: #666;
    line-height: 1.6;
  }
  .tool-card .tc-arrow {
    position: absolute;
    right: 20px; bottom: 20px;
    color: #c4b5fd;
    font-size: 18px;
    transition: all 0.25s ease;
  }
  .tool-card:hover .tc-arrow {
    color: #8b5cf6;
    transform: translateX(3px);
  }
</style>
</head>
<body>
<div id="header">
  <div class="brand">产业链平台</div>
</div>

<main>
  <h1 class="page-title">产业链平台 · 工具台</h1>
  <p class="page-subtitle">选择一个工具开始你的产业链分析工作</p>

  <div id="toolGrid">
    <a class="tool-card" href="spot.html">
      <div class="tc-icon">🕸️</div>
      <div class="tc-title">产业穿透</div>
      <div class="tc-desc">上传 Excel 数据文件，生成 3D 可视化图谱，穿透分析企业供应链、同业关系、投资关系等多维度关联网络。</div>
      <span class="tc-arrow">→</span>
    </a>
    <a class="tool-card" href="chainmap.html">
      <div class="tc-icon">🗺️</div>
      <div class="tc-title">产业链图谱演示</div>
      <div class="tc-desc">上传 Excel 层级数据，自动生成产业链全景图谱演示卡片，一级板块·二级子板块·三级项目清晰分层呈现。</div>
      <span class="tc-arrow">→</span>
    </a>
  </div>
</main>
</body>
</html>
