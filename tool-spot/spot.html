<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>产业穿透图谱 - 3D可视化平台</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; }
  body { background: #f5f3ff; color: #333; }

  #app { display: flex; flex-direction: column; height: 100vh; }

  #toolbar {
    height: 56px;
    background: linear-gradient(180deg, rgba(255,255,255,0.95), rgba(245,243,255,0.9));
    border-bottom: 1px solid rgba(139,92,246,0.15);
    display: flex;
    align-items: center;
    padding: 0 24px;
    gap: 16px;
    backdrop-filter: blur(10px);
    z-index: 10;
  }

  #toolbar .brand {
    font-size: 16px;
    font-weight: 600;
    color: #1a1a2e;
    letter-spacing: 1px;
    margin-right: 24px;
    background: linear-gradient(90deg, #8b5cf6, #c084fc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  #toolbar .breadcrumb { font-size: 13px; color: #888; }
  #toolbar .breadcrumb a { color: #949494; text-decoration: none; }
  #toolbar .breadcrumb a:hover { text-decoration: underline; }

  #fileInput { display: none; }

  select, button {
    padding: 7px 14px;
    background: rgba(255,255,255,0.8);
    border: 1px solid rgba(139,92,246,0.2);
    border-radius: 6px;
    color: #333;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  select:hover, button:hover { background: rgba(139,92,246,0.08); }
  select:disabled, button:disabled { opacity: 0.4; cursor: not-allowed; }

  #companyAutocomplete { position: relative; min-width: 260px; }
  #companyInput {
    width: 100%;
    padding: 7px 14px;
    background: rgba(255,255,255,0.8);
    border: 1px solid rgba(139,92,246,0.2);
    border-radius: 6px;
    color: #333;
    font-size: 13px;
    font-family: inherit;
    cursor: text;
    transition: all 0.2s;
    box-sizing: border-box;
  }
  #companyInput:hover:not(:disabled) { background: rgba(139,92,246,0.08); }
  #companyInput:focus {
    outline: none;
    border-color: #8b5cf6;
    box-shadow: 0 0 0 3px rgba(139,92,246,0.1);
  }
  #companyInput:disabled { opacity: 0.4; cursor: not-allowed; }
  #companyInput::placeholder { color: #999; }

  #companyDropdown {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: white;
    border: 1px solid rgba(139,92,246,0.2);
    border-radius: 6px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.1);
    margin-top: 4px;
    max-height: 240px;
    overflow-y: auto;
    z-index: 100;
    display: none;
  }
  #companyDropdown.show { display: block; }
  #companyDropdown .dropdown-item {
    padding: 8px 14px;
    cursor: pointer;
    font-size: 13px;
    color: #333;
    transition: background 0.15s;
  }
  #companyDropdown .dropdown-item:hover,
  #companyDropdown .dropdown-item.highlighted {
    background: rgba(139,92,246,0.08);
    color: #8b5cf6;
  }
  #companyDropdown .dropdown-empty {
    padding: 12px 14px;
    color: #999;
    font-size: 13px;
    text-align: center;
  }

  select, button {
    padding: 7px 14px;
    background: rgba(255,255,255,0.8);
    border: 1px solid rgba(139,92,246,0.2);
    border-radius: 6px;
    color: #333;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  select:hover, button:hover { background: rgba(139,92,246,0.08); }
  select:disabled, button:disabled { opacity: 0.4; cursor: not-allowed; }

  .btn-primary {
    background: linear-gradient(135deg, #8b5cf6, #c084fc);
    border: none;
    color: #fff;
    font-weight: 500;
    padding: 8px 20px;
  }
  .btn-primary:hover:not(:disabled) {
    background: linear-gradient(135deg, #8b5cf6, #c084fc);
    box-shadow: 0 4px 16px rgba(139,92,246,0.35);
    transform: translateY(-1px);
  }

  #downloadBtn {
    background: #fff;
    border: 1px solid #8b5cf6;
    color: #8b5cf6;
    font-weight: 500;
    padding: 8px 18px;
  }
  #downloadBtn:hover:not(:disabled) { background: rgba(139,92,246,0.08); }

  #statusBar {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: #666;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot.idle { background: #ccc; }
  .dot.loading { background: #faad14; animation: pulse 1s infinite; }
  .dot.success { background: #52c41a; }
  .dot.error { background: #ff4d4f; }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  #graphContainer {
    flex: 1;
    position: relative;
    overflow: hidden;
  }

  #overlay {
    position: absolute;
    top: 56px; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    z-index: 10;
  }
  #overlay > div { pointer-events: auto; }

  #rightPanel {
    position: absolute;
    top: 20px;
    right: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 200px;
  }

  #legend, #controls {
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(139,92,246,0.2);
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 12px;
    box-shadow: 0 4px 20px rgba(139,92,246,0.1);
    width: 100%;
  }

  #depthPanel {
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(139,92,246,0.2);
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 12px;
    box-shadow: 0 4px 20px rgba(139,92,246,0.1);
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  #depthPanel h4 { font-size: 13px; color: #1a1a2e; margin-bottom: 0; font-weight: 600; }
  .depth-radios { display: flex; flex-direction: row; gap: 8px; }
  .depth-radios label {
    flex: 1;
    text-align: center;
    padding: 6px 0;
    border: 1px solid rgba(139,92,246,0.25);
    border-radius: 6px;
    cursor: pointer;
    color: #555;
    font-size: 12px;
    transition: all 0.2s;
    user-select: none;
  }
  .depth-radios input { display: none; }
  .depth-radios label:has(input:checked) {
    background: linear-gradient(135deg, #8b5cf6, #c084fc);
    color: #fff;
    border-color: transparent;
    font-weight: 600;
  }

  #legend h4, #controls h4 { font-size: 13px; color: #1a1a2e; margin-bottom: 8px; font-weight: 600; }
  .legend-item { display: flex; align-items: center; gap: 8px; margin: 4px 0; color: #555; }
  .legend-color { width: 14px; height: 4px; border-radius: 2px; }
  .legend-node { width: 10px; height: 10px; border-radius: 50%; }

  #controls {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  #controls .tip { color: #888; font-size: 11px; line-height: 1.5; }

  /* ===== 左侧交叉分析配置卡片 ===== */
  #leftPanel {
    position: absolute;
    top: 20px;
    left: 20px;
    bottom: 20px;
    width: 224px;
    display: flex;
    flex-direction: column;
    z-index: 5;
  }
  #crossPanel {
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(139,92,246,0.2);
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 12px;
    box-shadow: 0 4px 20px rgba(139,92,246,0.1);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    flex: 1;
    min-height: 0;
  }
  #crossPanel h4 { font-size: 13px; color: #1a1a2e; margin-bottom: 8px; font-weight: 600; }
  .cross-tools { display: flex; gap: 6px; margin-bottom: 10px; }
  .cross-btn {
    flex: 1;
    border: 1px solid rgba(139,92,246,0.4);
    background: #fff;
    color: #8b5cf6;
    border-radius: 6px;
    padding: 5px 0;
    font-size: 12px;
    cursor: pointer;
    transition: all .15s;
  }
  .cross-btn:hover { background: #8b5cf6; color: #fff; }
  #crossList {
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 1;
    min-height: 0;
    margin-left: -4px;
    padding-right: 4px;
  }
  #crossList::-webkit-scrollbar { width: 4px; }
  #crossList::-webkit-scrollbar-thumb { background: rgba(139,92,246,0.3); border-radius: 4px; }
  .cross-card {
    border: 1px solid rgba(139,92,246,0.18);
    border-radius: 8px;
    padding: 6px 8px;
    display: flex;
    align-items: flex-start;
    gap: 8px;
    background: #faf9ff;
  }
  .cross-card .cc-icon { font-size: 16px; width: 22px; text-align: center; flex-shrink: 0; line-height: 1.2; }
  .cross-card .cc-body { flex: 1; min-width: 0; }
  .cross-card .cc-combo { font-size: 11px; color: #8b5cf6; font-weight: 600; }
  .cross-card .cc-note { font-size: 11px; color: #555; line-height: 1.3; margin-top: 2px; word-break: break-all; }
  .cross-card .cc-del {
    flex-shrink: 0;
    border: none;
    background: transparent;
    color: #bbb;
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
    padding: 0 2px;
  }
  .cross-card .cc-del:hover { color: #ff4d4f; }

  /* 新增/编辑表单 */
  .cross-editor {
    border: 1px solid rgba(139,92,246,0.3);
    border-radius: 8px;
    padding: 10px;
    background: #f6f3ff;
    margin-bottom: 10px;
    display: none;
    flex-direction: column;
    gap: 8px;
  }
  .cross-editor .ce-title { font-size: 12px; font-weight: 600; color: #8b5cf6; }
  .cross-editor label { font-size: 11px; color: #888; }
  .ce-pools { display: flex; flex-wrap: wrap; gap: 6px; }
  .ce-pool {
    font-size: 11px;
    border: 1px solid #ccc;
    background: #fff;
    color: #555;
    border-radius: 10px;
    padding: 3px 8px;
    cursor: pointer;
    transition: all .15s;
  }
  .ce-pool.selected { background: #8b5cf6; border-color: #8b5cf6; color: #fff; }
  .ce-note {
    width: 100%;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 6px;
    padding: 5px 8px;
    font-size: 12px;
    color: #333;
    outline: none;
  }
  .ce-note:focus { border-color: #8b5cf6; }
  .ce-icons { display: flex; flex-wrap: wrap; gap: 4px; max-height: 90px; overflow-y: auto; }
  .ce-ico {
    width: 26px; height: 26px;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
    border: 1px solid #ccc;
    border-radius: 6px;
    background: #fff;
    cursor: pointer;
    transition: all .15s;
  }
  .ce-ico.selected { border-color: #8b5cf6; background: #8b5cf6; }
  .ce-err { color: #ff4d4f; font-size: 11px; min-height: 14px; }
  .ce-actions { display: flex; gap: 6px; }

  .relation-group { margin-top: 10px; }
  .relation-group-title {
    font-size: 12px;
    color: #8b5cf6;
    margin-bottom: 6px;
    padding-bottom: 4px;
    border-bottom: 1px solid rgba(139,92,246,0.15);
  }

  .checkbox-row { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #333; }
  .checkbox-row input { accent-color: #8b5cf6; }

  #loadingOverlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(245,243,255,0.92);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
    z-index: 100;
  }
  #loadingOverlay.active { display: flex; }
  .spinner {
    width: 48px; height: 48px;
    border: 3px solid rgba(139,92,246,0.2);
    border-top-color: #8b5cf6;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loadingText { font-size: 14px; color: #666; }

  #tooltip {
    position: absolute;
    background: rgba(255,255,255,0.98);
    border: 1px solid rgba(139,92,246,0.25);
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 12px;
    pointer-events: none;
    z-index: 50;
    display: none;
    max-width: 280px;
    backdrop-filter: blur(10px);
    box-shadow: 0 4px 20px rgba(139,92,246,0.15);
  }
  #tooltip .tt-title { font-weight: 600; color: #1a1a2e; margin-bottom: 6px; font-size: 13px; }
  #tooltip .tt-rel { color: #555; line-height: 1.6; }
  #tooltip .tt-rel span { color: #8b5cf6; }

  #actionBar {
    position: absolute;
    top: 20px;
    right: 230px;
    display: flex;
    gap: 8px;
    z-index: 20;
    pointer-events: auto;
  }
  #app.fullscreen #actionBar { right: 20px; }
  .action-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 7px 14px;
    background: rgba(255,255,255,0.95);
    border: 1px solid rgba(139,92,246,0.2);
    color: #8b5cf6;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    backdrop-filter: blur(10px);
    box-shadow: 0 4px 20px rgba(139,92,246,0.1);
    transition: all .15s;
  }
  .action-btn:hover {
    background: linear-gradient(135deg, #8b5cf6, #c084fc);
    color: #fff;
    border-color: #8b5cf6;
    transform: translateY(-1px);
  }
  #app.fullscreen #toolbar,
  #app.fullscreen #crossPanel,
  #app.fullscreen #controls,
  #app.fullscreen #depthPanel,
  #app.fullscreen #legend {
    display: none !important;
  }

  #emptyState {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: #999;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  #emptyState.hidden { display: none; }

  #centerUpload {
    pointer-events: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  #centerSelect {
    pointer-events: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  #centerSelect .select-icon { font-size: 40px; color: #c4b5fd; }
  .center-upload-btn {
    width: 400px; height: 200px;
    border-radius: 12px;
    background: rgba(139, 92, 246, 0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.3s;
    border: 2px dashed rgba(139, 92, 246, 0.2);
    color: rgba(139, 92, 246, 0.8);
    flex-direction: column;
    gap: 12px;
    font-size: 16px;
    font-weight: 500;
  }
  .center-upload-btn:hover {
    background: rgba(139, 92, 246, 0.18);
    border-color: rgba(139, 92, 246, 0.4);
    color: rgba(107, 70, 193, 1);
  }
  .center-upload-btn .upload-icon {
    font-size: 48px;
    line-height: 1;
  }
  .center-upload-btn .upload-text {
    margin-top: 0;
  }

  .center-description {
    font-size: 14px;
    color: #666;
    line-height: 1.6;
  }

  .template-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    background: rgba(139,92,246,0.08);
    border: 1px solid rgba(139,92,246,0.25);
    border-radius: 20px;
    color: #8b5cf6;
    font-size: 12px;
    text-decoration: none;
    cursor: pointer;
    transition: all 0.2s;
  }
  .template-link:hover {
    background: rgba(139,92,246,0.15);
    border-color: #8b5cf6;
  }

  #statusBar .status-item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 8px;
    border-radius: 6px;
    transition: background-color 0.2s, color 0.2s;
    position: relative;
    cursor: default;
    background-color: transparent;
  }
  #statusBar .status-item.is-hover {
    background-color: rgba(255,77,79,0.08) !important;
  }
  #statusBar .status-item .delete-btn {
    display: none;
    cursor: pointer;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: rgba(255,77,79,0.15);
    border: 1px solid rgba(255,77,79,0.4);
    color: #ff4d4f;
    font-size: 10px;
    line-height: 1;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  #statusBar .status-item.is-hover .status-dot {
    display: none;
  }
  #statusBar .status-item.is-hover .delete-btn {
    display: inline-flex;
  }
  #statusBar .status-item.is-hover .status-text {
    color: #ff4d4f;
  }
  #statusBar .status-item .delete-btn:hover {
    background: rgba(255,77,79,0.3);
    transform: scale(1.1);
  }
</style>
</head>
<body>
<div id="app">
  <div id="toolbar">
    <div class="brand">SPOT 产业穿透</div>
    <div class="breadcrumb"><a href="../index.html">← 回到工具台</a></div>
    <div id="statusBar">
      <div class="status-item" id="statusItem">
        <span class="dot idle status-dot" id="statusDot"></span>
        <span class="delete-btn" id="statusDeleteBtn" title="删除已上传文件">✕</span>
        <span id="statusText" class="status-text">等待上传数据</span>
      </div>
    </div>
    <div id="companyAutocomplete">
      <input type="text" id="companyInput" disabled placeholder="-- 请选择企业 --" autocomplete="off" />
      <div id="companyDropdown"></div>
    </div>
    <button class="btn-primary" id="generateBtn" disabled>✨ 生成图谱</button>
    <button id="downloadBtn" disabled title="将穿透结果导出为Excel（5个Sheet）">下载Excel</button>
  </div>

  <div id="graphContainer"></div>

  <div id="overlay">
    <div id="leftPanel">
      <div id="crossPanel">
        <h4>交叉分析</h4>
        <div class="cross-tools">
          <button class="cross-btn" id="addCrossBtn">＋ 新增组合</button>
          <button class="cross-btn" id="resetCrossBtn">↺ 重置</button>
        </div>
        <div class="cross-editor" id="crossEditor">
          <div class="ce-title">新增交叉组合</div>
          <label>选择企业池（2-5 个）</label>
          <div class="ce-pools" id="cePools"></div>
          <label>自定义备注</label>
          <input class="ce-note" id="ceNote" placeholder="请输入备注" maxlength="40" />
          <label>选择图标</label>
          <div class="ce-icons" id="ceIcons"></div>
          <div class="ce-err" id="ceErr"></div>
          <div class="ce-actions">
            <button class="cross-btn" id="ceSave">保存</button>
            <button class="cross-btn" id="ceCancel">取消</button>
          </div>
        </div>
        <div id="crossList"></div>
      </div>
    </div>
    <div id="emptyState">
      <div id="centerUpload">
        <input type="file" id="fileInput" accept=".xlsx,.xls" style="display:none" />
        <button class="center-upload-btn" id="centerUploadBtn" title="点击上传Excel数据文件">
          <span class="upload-icon">📂</span>
          <span class="upload-text">上传数据文件</span>
        </button>
        <div class="center-description">请上传数据文件并选择企业以生成3D产业穿透图谱</div>
        <a class="template-link" id="templateLink" href="#" onclick="downloadTemplate(event)">
          <span>📋</span>
          <span>下载示例模板</span>
        </a>
      </div>
      <div id="centerSelect" style="display:none;">
        <div class="select-icon">🔎</div>
        <div class="center-description">请选择要穿透的企业</div>
      </div>
    </div>

    <div id="rightPanel">
      <div id="controls">
        <h4>显示控制</h4>
        <div class="checkbox-row">
          <input type="checkbox" id="toggleNodeLabels" checked />
          <label for="toggleNodeLabels">显示节点标签</label>
        </div>
        <div class="tip" style="margin-top:8px;">
          🖱️ 拖拽节点移动<br>
          🔄 拖拽空白旋转视角<br>
          🔍 滚轮缩放
        </div>
      </div>

      <div id="depthPanel">
        <h4>穿透层级</h4>
        <div class="depth-radios">
          <label><input type="radio" name="penetrationDepth" value="1" checked /> 1层</label>
          <label><input type="radio" name="penetrationDepth" value="2" /> 2层</label>
          <label><input type="radio" name="penetrationDepth" value="3" /> 3层</label>
        </div>
      </div>

      <div id="legend">
        <h4>关系图例</h4>
        <div class="relation-group">
          <div class="relation-group-title">同业关系</div>
          <div class="legend-item"><div class="legend-color" style="background:#ff4d4f"></div>产品竞争 (池1)</div>

  let crossRules = DEFAULT_CROSS_RULES.map(r => ({ pools: r.pools.slice(), note: r.note, icon: r.icon }));
  function poolsToCombo(pools) {
    return pools.map(p => p.replace('pool', '池')).join(' ∩ ');
  }

  // 计算节点命中规则：取满足的所有规则中最特异（池数量最多）的一条；数量相同则取列表中靠前的
  function matchCrossRule(nodePools) {
    if (!nodePools || nodePools.length === 0) return null;
    let best = null;
    for (const rule of crossRules) {
      if (rule.pools.every(p => nodePools.includes(p))) {
        if (!best || rule.pools.length > best.pools.length) best = rule;
      }
    }
    return best;
  }

  // 渲染左侧配置列表
  function renderCrossList() {
    const list = $('crossList');
    list.innerHTML = '';
    crossRules.forEach((rule, idx) => {
      const card = document.createElement('div');
      card.className = 'cross-card';
      card.innerHTML =
        '<span class="cc-icon">' + rule.icon + '</span>' +
        '<div class="cc-body">' +
          '<div class="cc-combo">' + poolsToCombo(rule.pools) + '</div>' +
          '<div class="cc-note">' + (rule.note || '') + '</div>' +
        '</div>' +
        '<button class="cc-del" title="删除该组合">✕</button>';
      card.querySelector('.cc-del').onclick = () => {
        crossRules.splice(idx, 1);
        renderCrossList();
        refreshGraph();
      };
      list.appendChild(card);
    });
  }

  // 打开新增表单
  function openCrossEditor() {
    const editor = $('crossEditor');
    editor.style.display = 'flex';
    const poolsWrap = $('cePools');
    poolsWrap.innerHTML = '';
    const selectedPools = [];
    ['pool1','pool2','pool3','pool4','pool5','pool6','pool7','pool8'].forEach(p => {
      const chip = document.createElement('span');
      chip.className = 'ce-pool';
      chip.textContent = p.replace('pool', '池');
      chip.onclick = () => {
        const i = selectedPools.indexOf(p);
        if (i >= 0) { selectedPools.splice(i, 1); chip.classList.remove('selected'); }
        else if (selectedPools.length < 5) { selectedPools.push(p); chip.classList.add('selected'); }
        $('ceErr').textContent = '';
      };
      poolsWrap.appendChild(chip);
    });
    const iconsWrap = $('ceIcons');
    iconsWrap.innerHTML = '';
    let selectedIcon = null;
    CROSS_ICONS.forEach(ic => {
      const box = document.createElement('span');
      box.className = 'ce-ico';
      box.textContent = ic;
      box.onclick = () => {
        iconsWrap.querySelectorAll('.ce-ico').forEach(b => b.classList.remove('selected'));
        box.classList.add('selected');
        selectedIcon = ic;
        $('ceErr').textContent = '';
      };
      iconsWrap.appendChild(box);
    });
    $('ceNote').value = '';
    $('ceErr').textContent = '';
    $('ceNote').onkeydown = e => { if (e.key === 'Enter') $('ceSave').click(); };
    // 由内部状态决定保存值，按钮点击时校验
    window.__crossEditorState = { selectedPools, selectedIcon, get: () => ({ pools: selectedPools.slice(), icon: selectedIcon }) };
    $('ceNote').focus();
  }

  function closeCrossEditor() {
    $('crossEditor').style.display = 'none';
    window.__crossEditorState = null;
  }

  function initCrossPanel() {
    renderCrossList();
    $('addCrossBtn').onclick = () => openCrossEditor();
    $('ceCancel').onclick = () => closeCrossEditor();
    $('ceSave').onclick = () => {
      const st = window.__crossEditorState;
      if (!st) return;
      const { pools, icon } = st.get();
      if (pools.length < 2 || pools.length > 5) {
        $('ceErr').textContent = '请选择 2-5 个企业池';

      if (!icon) { $('ceErr').textContent = '请选择一个图标'; return; }

  function refreshGraph() {

  let graph = null;
  let parsedData = null;
  let currentNodeId = null;
  let graphData = null;

  function setStatus(text, state) {

  // 导出穿透结果 Excel（5个sheet：主目录、1层、2层、3层、汇总）
  function exportPenetrationExcel() {
    if (!graphData || !graphData.nodes || !graphData.nodes.length) {
      alert('请先生成图谱后再下载');
      return;
    }
    const POOL_ORDER = ['pool1','pool2','pool3','pool4','pool5','pool6','pool7','pool8'];
    const center = graphData.nodes.find(n => n.isCenter);
    const centerLabel = center ? center.label : '';

    // 无论页面选择几层穿透、也不受层级企业数量上限限制，导出全部关联企业（仍遵循“不回往回关联”的发散规则）
    const full = computePenetration(centerLabel, 3, true);

    const relStr = node => (node.pools || []).slice()
      .sort((a, b) => POOL_ORDER.indexOf(a) - POOL_ORDER.indexOf(b))
      .map(p => POOL_LABELS[p] || p).join(',');
    const crossStr = node => node.crossIcon ? node.crossIcon + ' ' + (node.crossNote || '') : (node.crossNote || '');

    // 交叉分析组合命中顺序（命中列表越靠前越优先，未命中为无穷大）
    const crossIdx = pools => {
      for (let i = 0; i < crossRules.length; i++) {
        if (crossRules[i].pools.every(p => pools.indexOf(p) >= 0)) return i;
      }
      return Infinity;
    };

    // 每个层级：父 -> 子 一行；同一父企业下的关联企业先按关系个数倒序，再按交叉分析组合顺序排序
    const levelRows = { 1: [], 2: [], 3: [] };
    [1,2,3].forEach(L => {
      const byParent = {};   // parent -> [node]
      full.nodes.forEach(n => {
        if (!n.isCenter && n.level === L) {
          (byParent[n.parent] = byParent[n.parent] || []).push(n);
        }
      });
      Object.keys(byParent).forEach(parent => {
        byParent[parent].sort((a, b) => {
          if (b.pools.length !== a.pools.length) return b.pools.length - a.pools.length;   // ① 关系个数从多到少
          const d = crossIdx(a.pools) - crossIdx(b.pools);                                 // ② 交叉分析组合顺序
          if (d !== 0) return d;
          return a.label.localeCompare(b.label, 'zh');                                     // ③ 同名兜底，保证稳定
        });
        byParent[parent].forEach(n => {
          levelRows[L].push({ parent: n.parent, child: n.label, rel: relStr(n), cross: crossStr(n) });
        });
      });
    });

    // 父企业在"下一层"sheet 的起始行（数据区自第3行起）
    const parentRow = { 2: {}, 3: {} };
    [2,3].forEach(L => {
      const map = parentRow[L];
      levelRows[L].forEach((r, i) => { if (!(r.parent in map)) map[r.parent] = i + 3; });
    });

    // 汇总：每个叶/分支端点为一行，B=1层企业, E=2层企业, H=3层企业
    const child2 = {}, child3 = {};
    levelRows[2].forEach(r => { (child2[r.parent] = child2[r.parent] || []).push(r); });
    levelRows[3].forEach(r => { (child3[r.parent] = child3[r.parent] || []).push(r); });
    const sumRows = [];
    levelRows[1].forEach(r1 => {
      const c2 = child2[r1.child] || [];
      if (!c2.length) { sumRows.push({ B: r1, E: null, H: null }); return; }
      c2.forEach(r2 => {
        const c3 = child3[r2.child] || [];
        if (!c3.length) { sumRows.push({ B: r1, E: r2, H: null }); return; }
        c3.forEach(r3 => sumRows.push({ B: r1, E: r2, H: r3 }));
      });
    });

    const enc = (r, c) => XLSX.utils.encode_cell({ r, c });
    // 收集各 sheet 描述，最后统一生成并下载（社区版 SheetJS 无法写入样式，故自行组装 OOXML）
    const sheets = [];   // { name, cells, ref, headers }
    function addSheet(name, cells, ref, headers) {
      sheets.push({ name, cells, ref, headers });
    }

    // ---- 主目录 ----
    const toc = {};
    toc['A1'] = { v: '穿透层级' }; toc['B1'] = { v: '数据行数' }; toc['C1'] = { v: '超链接' };
    const tocData = [
      ['1层', levelRows[1].length, "#'1层'!A1"],
      ['2层', levelRows[2].length, "#'2层'!A1"],
      ['3层', levelRows[3].length, "#'3层'!A1"],
      ['汇总', sumRows.length, '#汇总!A1']
    ];
    tocData.forEach((r, i) => {
      const row = i + 1;
      toc[enc(row, 0)] = { v: r[0] };
      toc[enc(row, 1)] = { v: r[1], t: 'n' };
      toc[enc(row, 2)] = { v: '点击跳转', link: r[2] };
    });
    addSheet('主目录', toc, 'A1:C5', ['A1', 'B1', 'C1']);

    // ---- 1层 / 2层 / 3层 ----
    const LEVEL_SHEET = { 1: '1层', 2: '2层', 3: '3层' };
    [1,2,3].forEach(L => {
      const cells = {};
      cells['A1'] = { v: '主目录', link: '##主目录!A1' };
      cells['A2'] = { v: '中心企业' }; cells['B2'] = { v: '关联企业' };
      cells['C2'] = { v: '关联关系' }; cells['D2'] = { v: '交叉分析' };
      const rows = levelRows[L];
      rows.forEach((r, i) => {
        const row = i + 2;
        cells[enc(row, 0)] = { v: r.parent };
        cells[enc(row, 1)] = { v: r.child };
        cells[enc(row, 2)] = { v: r.rel };
        if (r.cross) cells[enc(row, 3)] = { v: r.cross };
        if (L < 3) {
          const m = parentRow[L + 1];
          if (m[r.child] !== undefined) cells[enc(row, 1)].link = "#'" + LEVEL_SHEET[L + 1] + "'!A" + m[r.child];
        }
      });
      addSheet(LEVEL_SHEET[L], cells, 'A1:D' + (2 + rows.length), ['A2', 'B2', 'C2', 'D2']);
    });

    // ---- 汇总 ----
    const s = {};
    s['A1'] = { v: '主目录', link: '##主目录!A1' };
    ['中心企业','1层关联企业','关联关系','交叉分析','2层关联企业','关联关系','交叉分析','3层关联企业','关联关系','交叉分析']
      .forEach((h, c) => { s[enc(1, c)] = { v: h }; });
    sumRows.forEach((sum, i) => {
      const row = i + 2;
      s[enc(row, 0)] = { v: centerLabel };
      if (sum.B) {
        const b = { v: sum.B.child };
        if (parentRow[2][sum.B.child] !== undefined) b.link = "#'2层'!A" + parentRow[2][sum.B.child];
        s[enc(row, 1)] = b;
        if (sum.B.rel) s[enc(row, 2)] = { v: sum.B.rel };
        if (sum.B.cross) s[enc(row, 3)] = { v: sum.B.cross };
      }
      if (sum.E) {
        const e = { v: sum.E.child };
        if (parentRow[3][sum.E.child] !== undefined) e.link = "#'3层'!A" + parentRow[3][sum.E.child];
        s[enc(row, 4)] = e;
        if (sum.E.rel) s[enc(row, 5)] = { v: sum.E.rel };
        if (sum.E.cross) s[enc(row, 6)] = { v: sum.E.cross };
      }
      if (sum.H) {
        s[enc(row, 7)] = { v: sum.H.child };
        if (sum.H.rel) s[enc(row, 8)] = { v: sum.H.rel };
        if (sum.H.cross) s[enc(row, 9)] = { v: sum.H.cross };
      }
    });
    addSheet('汇总', s, 'A1:J' + (2 + sumRows.length),
      ['A2', 'B2', 'C2', 'D2', 'E2', 'F2', 'G2', 'H2', 'I2', 'J2']);

    const fname = centerLabel ? centerLabel + '_穿透结果.xlsx' : '穿透结果.xlsx';
    const bytes = buildStyledXlsx(sheets);
    const blob = new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = fname;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  // ============ 自建带格式的 XLSX 生成器 ============
  // 说明：社区版 SheetJS 无法写入单元格样式，因此导出部分用原生 OOXML + STORED ZIP 自行组装，
  // 以支持：宋体11、字段名#339966底白字加粗斜体、超链接下划线、列宽统一 8.43。
  function buildStyledXlsx(sheets) {
    const enc = new TextEncoder();
    const entries = [];
    entries.push({ name: '[Content_Types].xml', data: enc.encode(contentTypesXml(sheets.length)) });
    entries.push({ name: '_rels/.rels', data: enc.encode(rootRelsXml()) });
    entries.push({ name: 'xl/workbook.xml', data: enc.encode(workbookXml(sheets.map(s => s.name))) });
    entries.push({ name: 'xl/_rels/workbook.xml.rels', data: enc.encode(workbookRelsXml(sheets.length)) });
    entries.push({ name: 'xl/styles.xml', data: enc.encode(stylesXml()) });
    entries.push({ name: 'xl/theme/theme1.xml', data: enc.encode(themeXml()) });
    sheets.forEach((s, i) => {
      entries.push({ name: 'xl/worksheets/sheet' + (i + 1) + '.xml', data: enc.encode(sheetXml(s.name, s.cells, s.ref, s.headers)) });
    });
    return buildZip(entries);
  }

  function escXml(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function colIndex(letters) { let n = 0; for (const ch of letters) n = n * 26 + (ch.charCodeAt(0) - 64); return n; }

  // ---- ZIP（STORED，无压缩） ----
  const ZIP_CRC_TABLE = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); t[n] = c >>> 0; } return t; })();
  function zipCrc32(u8) { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = (ZIP_CRC_TABLE[(c ^ u8[i]) & 0xFF] ^ (c >>> 8)) >>> 0; return (c ^ 0xFFFFFFFF) >>> 0; }
  function concatBytes(arr) { let len = 0; for (const a of arr) len += a.length; const out = new Uint8Array(len); let o = 0; for (const a of arr) { out.set(a, o); o += a.length; } return out; }
  function buildZip(entries) {
    const enc = new TextEncoder(); const parts = []; const central = []; let offset = 0;
    for (const e of entries) {
      const name = enc.encode(e.name); const data = e.data; const crc = zipCrc32(data);
      const lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0, true);
      lh.setUint16(8, 0, true); lh.setUint16(10, 0, true); lh.setUint16(12, 0, true);
      lh.setUint32(14, crc, true); lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true);
      lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
      parts.push(new Uint8Array(lh.buffer), name, data);
      const ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true);
      ch.setUint16(8, 0, true); ch.setUint16(10, 0, true); ch.setUint16(12, 0, true); ch.setUint16(14, 0, true);
      ch.setUint32(16, crc, true); ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true);
      ch.setUint16(28, name.length, true); ch.setUint16(30, 0, true); ch.setUint16(32, 0, true);
      ch.setUint16(34, 0, true); ch.setUint16(36, 0, true); ch.setUint32(38, 0, true); ch.setUint32(42, offset, true);
      central.push(new Uint8Array(ch.buffer), name); offset += 30 + name.length + data.length;
    }
    const cdSize = central.reduce((a, b) => a + b.length, 0); const cdOffset = offset;
    const eocd = new DataView(new ArrayBuffer(22));
    eocd.setUint32(0, 0x06054b50, true); eocd.setUint16(4, 0, true); eocd.setUint16(6, 0, true);
    eocd.setUint16(8, entries.length, true); eocd.setUint16(10, entries.length, true);
    eocd.setUint32(12, cdSize, true); eocd.setUint32(16, cdOffset, true); eocd.setUint16(20, 0, true);
    parts.push(...central, new Uint8Array(eocd.buffer));
    return concatBytes(parts);
  }

  // ---- 各类 OOXML ----

      '<a:effectStyleLst><a:effectStyle><a:effectLst/><a:scene3d/><a:sp3d/></a:effectStyle></a:effectStyleLst>' +
      '<a:bgFillStyleLst><a:solidFill><a:schemeClr val="phClr"/></a:solidFill>' +
      '<a:gradFill rotWithShape="1"><a:gsLst><a:gs pos="0"><a:schemeClr val="phClr"/></a:gs><a:gs pos="100000"><a:schemeClr val="phClr"/></a:gs></a:gsLst></a:gradFill></a:bgFillStyleLst>' +

  function workbookXml(names) {
    const sheetsTag = names.map((n, i) => '<sheet name="' + escXml(n) + '" sheetId="' + (i + 1) + '" r:id="rId' + (i + 1) + '"/>').join('');
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
      '<sheets>' + sheetsTag + '</sheets></workbook>';
  }
  function workbookRelsXml(n) {
    let r = '';
    for (let i = 1; i <= n; i++) r += '<Relationship Id="rId' + i + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet' + i + '.xml"/>';
    r += '<Relationship Id="rId' + (n + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>';
    r += '<Relationship Id="rId' + (n + 2) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/theme" Target="theme/theme1.xml"/>';
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' + r + '</Relationships>';
  }
  function contentTypesXml(n) {
    let s = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
      '<Default Extension="xml" ContentType="application/xml"/>' +
      '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>';
    for (let i = 1; i <= n; i++) s += '<Override PartName="/xl/worksheets/sheet' + i + '.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>';
    s += '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>';
    s += '<Override PartName="/xl/theme/theme1.xml" ContentType="application/vnd.openxmlformats-officedocument.theme+xml"/>';
    s += '</Types>';
    return s;
  }
  function rootRelsXml() {
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +
      '</Relationships>';
  }
  function toLocation(link) {
    let s = String(link).replace(/^#+/, '');
    const m = s.match(/^(.+)!(.+)$/);
    if (m) { let sheet = m[1], c = m[2]; if (!/^['"]/.test(sheet)) sheet = "'" + sheet + "'"; return sheet + '!' + c; }
    return s;
  }
  function sheetXml(name, cells, ref, headerAddrs) {
    const headerSet = new Set(headerAddrs || []);
    const lastCol = ref.split(':')[1].match(/^([A-Z]+)/)[1];
    const colCount = colIndex(lastCol);
    let cols = '<cols>';
    for (let i = 1; i <= colCount; i++) cols += '<col min="' + i + '" max="' + i + '" width="8.43" customWidth="1"/>';
    cols += '</cols>';
    const rows = {}; const links = [];
    for (const addr in cells) {
      const cd = cells[addr]; if (!cd) continue;
      const m = addr.match(/^([A-Z]+)(\d+)$/); if (!m) continue;
      const col = m[1]; const row = +m[2];
      const isHeader = headerSet.has(addr);
      const sAtt = isHeader ? ' s="1"' : (cd.link ? ' s="2"' : '');
      const isNum = cd.t === 'n';
      const tAtt = ' t="' + (isNum ? 'n' : 'inlineStr') + '"';
      const content = isNum ? '<v>' + cd.v + '</v>' : '<is><t xml:space="preserve">' + escXml(cd.v) + '</t></is>';
      (rows[row] = rows[row] || []).push({ idx: colIndex(col), xml: '<c r="' + addr + '"' + tAtt + sAtt + '>' + content + '</c>' });
      if (cd.link) links.push('<hyperlink ref="' + addr + '" location="' + escXml(toLocation(cd.link)) + '"/>');
    }
    let body = '<sheetData>';
    Object.keys(rows).map(Number).sort((a, b) => a - b).forEach(r => {
      rows[r].sort((a, b) => a.idx - b.idx);
      body += '<row r="' + r + '">' + rows[r].map(x => x.xml).join('') + '</row>';
    });
    body += '</sheetData>';
    if (links.length) body += '<hyperlinks>' + links.join('') + '</hyperlinks>';
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
      '<dimension ref="' + ref + '"/>' +
      '<sheetViews><sheetView workbookViewId="0"/></sheetViews>' +
      '<sheetFormatPr defaultRowHeight="15"/>' +
      cols + body + '</worksheet>';
  }

    const file = e.target.files[0];

    setStatus('正在解析文件...', 'loading');

    try {

  function parseWorkbook(wb) {
    const result = {};
    const sheetToTable = {
      [TABLE_NAMES.productMaterial]: 'productMaterial',
      [TABLE_NAMES.companyProduct]: 'companyProduct',
      [TABLE_NAMES.patentOwner]: 'patentOwner',
      [TABLE_NAMES.supplyChain]: 'supplyChain',
      [TABLE_NAMES.equityInvestment]: 'equityInvestment'
    };

    for (const [sheetName, key] of Object.entries(sheetToTable)) {
      const ws = wb.Sheets[sheetName];
      if (!ws) {
        result[key] = [];
        continue;
      }
      const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
      if (rows.length <= 1) {
        result[key] = [];
        continue;
      }
      const headers = rows[0];
      result[key] = rows.slice(1).filter(r => r.length >= 2).map(r => ({
        [headers[0]]: String(r[0]).trim(),
        [headers[1]]: String(r[1]).trim()
      }));
    }
    return result;
  }

  function getAllCompanies(data) {
    const set = new Set();
    data.companyProduct.forEach(r => set.add(r['企业']));
    data.supplyChain.forEach(r => { set.add(r['供方']); set.add(r['销方']); });
    data.equityInvestment.forEach(r => { set.add(r['股东']); set.add(r['被投资企业']); });
    data.patentOwner.forEach(r => set.add(r['专利权人']));
    return Array.from(set).sort();
  }

  let allCompanies = [];
  let selectedCompany = null;
  let highlightedIndex = -1;

  function populateCompanySelect(companies) {
    allCompanies = companies;
    const input = $('companyInput');
    const dropdown = $('companyDropdown');
    input.disabled = false;
    input.placeholder = '请输入企业名称搜索...';
    input.value = '';
    dropdown.innerHTML = '';
    dropdown.classList.remove('show');
    highlightedIndex = -1;
    $('generateBtn').disabled = false;
  }

  function showDropdown(filter) {
    const dropdown = $('companyDropdown');
    const input = $('companyInput');
    dropdown.innerHTML = '';
    
    let filtered = allCompanies;
    if (filter) {
      filtered = allCompanies.filter(c => c.toLowerCase().includes(filter.toLowerCase()));
    }
    
    if (filtered.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'dropdown-empty';
      empty.textContent = '未找到匹配的企业';
      dropdown.appendChild(empty);
    } else {
      filtered.forEach((c, idx) => {
        const item = document.createElement('div');
        item.className = 'dropdown-item';
        item.textContent = c;
        item.dataset.company = c;
        item.dataset.index = idx;
        item.addEventListener('mousedown', (e) => {
          e.preventDefault();
          selectCompany(c);
        });
        item.addEventListener('mouseenter', () => {
          highlightedIndex = idx;
          updateHighlight();
        });
        dropdown.appendChild(item);
      });
    }
    
    highlightedIndex = -1;
    dropdown.classList.add('show');
  }

  function hideDropdown() {
    $('companyDropdown').classList.remove('show');
    highlightedIndex = -1;
  }

  function updateHighlight() {
    const items = $('companyDropdown').querySelectorAll('.dropdown-item');
    items.forEach((item, idx) => {
      if (idx === highlightedIndex) {
        item.classList.add('highlighted');
        item.scrollIntoView({ block: 'nearest' });
      } else {
        item.classList.remove('highlighted');
      }
    });
  }

  function selectCompany(company) {
    selectedCompany = company;
    $('companyInput').value = company;
    $('companyInput').placeholder = '';
    hideDropdown();
    $('generateBtn').disabled = false;
  }

  $('companyInput').addEventListener('input', function(e) {
    const value = e.target.value.trim();
    selectedCompany = null;
    showDropdown(value);
  });

  $('companyInput').addEventListener('focus', function() {
